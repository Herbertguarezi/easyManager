spring.application.name=easymanager
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# Schema is owned by Flyway migrations; Hibernate only validates that the
# entity mappings match what Flyway created, it never alters the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
# The dev database already had `products` created by the old ddl-auto=update
# before Flyway was introduced. baseline-on-migrate marks that pre-existing
# schema as satisfying V1 without re-running it; a fresh database (new
# environment, test database) has no pre-existing schema, so this has no
# effect there and V1 runs for real, from an empty schema.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Exact origin required (see docs/easy-manager-software-engineering.md sec.
# 4.2/10.1) — defaults to the frontend's local dev URL, overridden via
# CORS_ALLOWED_ORIGIN in other environments.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# One env var per purpose, never reused (see sec. 4.4). No defaults on
# purpose: a missing one must stop the application from starting.
app.security.keys.jwt-secret=${JWT_SECRET}
app.security.keys.marketplace-encryption-key=${MARKETPLACE_ENCRYPTION_KEY}
app.security.keys.webhook-secret=${WEBHOOK_SECRET}
app.security.keys.email-token-secret=${EMAIL_TOKEN_SECRET}
upload.directory=uploads
# Caminho f�sico onde os arquivos est�o
spring.web.resources.static-locations=file:uploads/
# Opcional: pode mudar o prefixo da URL, se quiser
spring.mvc.static-path-pattern=/images/**
